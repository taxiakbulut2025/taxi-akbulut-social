name: Social-Autopilot

on:
  schedule:
    - cron: "5,35 * * * *"   # alle 30 Minuten prüfen (UTC)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur testen, nichts veröffentlichen"
        type: boolean
        default: true
      yt_test:
        description: "YouTube-Testupload (privat), sonst nichts"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: social-autopilot
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fällige Posts veröffentlichen
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.yt_test || 'false' }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: python publisher/publish.py
      - name: Status speichern
        if: always()
        run: |
          git config user.name "social-autopilot"
          git config user.email "actions@users.noreply.github.com"
          git add -A queue published failed reels state.json testlauf.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "Autopilot: Status aktualisiert" && git push)
